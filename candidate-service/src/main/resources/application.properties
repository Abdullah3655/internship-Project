spring.application.name=candidate-service
server.port=8082
spring.jpa.open-in-view=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.datasource.url=jdbc:mysql://localhost:3308/candidate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=change-this-to-a-long-random-secret-key-for-production
jwt.expiration-ms=86400000

file.upload-dir=uploads

api.version=1.0

springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true

spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.skip.in-tests=true
