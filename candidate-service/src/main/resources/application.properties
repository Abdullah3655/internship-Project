spring.application.name=candidate-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3308/candidate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=change-this-to-a-long-random-secret-key-for-production
jwt.expiration-ms=86400000

file.upload-dir=uploads
