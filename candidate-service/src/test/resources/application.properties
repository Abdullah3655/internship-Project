spring.application.name=candidate-service
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:candidate_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false
spring.docker.compose.skip.in-tests=true

jwt.secret=change-this-to-a-long-random-secret-key-for-production
jwt.expiration-ms=86400000
file.upload-dir=${java.io.tmpdir}/candidate-uploads-test
api.version=1.0
