spring.application.name=application-service
server.port=8083
spring.jpa.open-in-view=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3309/application_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=change-this-to-a-long-random-secret-key-for-production
jwt.expiration-ms=86400000

api.version=1.0

services.candidate-service-url=http://localhost:8082
services.auth-service-url=http://localhost:8081

springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true

spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.skip.in-tests=true
