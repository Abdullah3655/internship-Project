spring.application.name=application-service
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:application_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false
spring.docker.compose.skip.in-tests=true

jwt.secret=change-this-to-a-long-random-secret-key-for-production
jwt.expiration-ms=86400000
api.version=1.0

services.candidate-service-url=http://localhost:8082
services.auth-service-url=http://localhost:8081
