name: application-service

services:
  application-db:
    image: mysql:latest
    container_name: recruitment-application-db
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: application_db
    volumes:
      - application_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      org.springframework.boot.ignore: true

volumes:
  application_data:
