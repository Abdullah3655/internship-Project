spring.application.name=auth-service
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false
spring.docker.compose.skip.in-tests=true

jwt.secret=change-this-to-a-long-random-secret-key-for-production
jwt.expiration-ms=86400000
api.version=1.0

ldap.enabled=false
ldap.url=ldap://localhost:1389
ldap.base=dc=company,dc=com
ldap.admin-dn=cn=admin,dc=company,dc=com
ldap.admin-password=admin
ldap.user-ou=users
