name: auth-service

services:
  auth-db:
    image: mysql:latest
    container_name: recruitment-auth-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    volumes:
      - auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      org.springframework.boot.ignore: true

  openldap:
    image: bitnamilegacy/openldap:2.6.8
    container_name: recruitment-openldap
    ports:
      - "1389:1389"
    environment:
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_ROOT: dc=company,dc=com
      LDAP_USER_DC: users
      LDAP_GROUP_DC: groups
      LDAP_USERS: ldap.hr
      LDAP_PASSWORDS: password123
    volumes:
      - openldap_data:/bitnami/openldap
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/1389"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    labels:
      org.springframework.boot.ignore: true

volumes:
  auth_data:
  openldap_data:
